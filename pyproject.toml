[project]
name = "sentinel"
version = "0.1.0"
description = "Real-time fraud risk scoring with an AI investigator agent"
readme = "README.md"
authors = [{ name = "Shola Akinade" }]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "kaggle>=2.2.5",
    "lightgbm>=4.7.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "six>=1.17.0",
]

[project.scripts]
sentinel = "sentinel:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]
